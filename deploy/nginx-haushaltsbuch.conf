# /etc/nginx/sites-available/haushaltsbuch
#
# Schritt 1: So wie hier (nur Port 80) aktivieren, dann
#   sudo certbot --nginx -d haushaltsbuch.svetho.net
# Certbot ergänzt die HTTPS-Einstellungen und die Umleitung von http auf https selbst.

server {
    listen 80;
    listen [::]:80;
    server_name haushaltsbuch.svetho.net;

    # Passwortschutz für die ganze Seite
    auth_basic           "Haushaltsbuch";
    auth_basic_user_file /etc/nginx/htpasswd-haushaltsbuch;

    # Let's Encrypt muss die Bestätigungsdatei ohne Passwort abrufen können
    location /.well-known/acme-challenge/ {
        auth_basic off;
        root /var/www/html;
    }

    # Sicherungsdateien können etwas größer werden
    client_max_body_size 20m;

    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;

    location / {
        proxy_pass         http://127.0.0.1:8085;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
